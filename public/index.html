<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeScope AI — 차트 분석 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--bg2:#111827;--card:#1a2035;--input:#0d1321;
  --border:#1e2a42;--border-active:#3b82f6;
  --text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;
  --accent:#3b82f6;--accent-glow:rgba(59,130,246,0.15);
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;--cyan:#06b6d4;
  --blue:#3b82f6;--purple:#8b5cf6;
  --mono:'JetBrains Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --r:8px;--r-lg:12px;
}
html{font-size:14px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== INVITE SCREEN ===== */
#inviteScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.invite-container{text-align:center;max-width:420px;width:90%;animation:fadeUp .6s ease}
.invite-logo{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--accent);margin-bottom:.5rem;letter-spacing:-1px}
.invite-logo span{color:var(--text)}
.invite-sub{color:var(--muted);margin-bottom:2.5rem;font-size:.9rem}
.invite-input-wrap input{width:100%;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:1rem;text-align:center;letter-spacing:3px;text-transform:uppercase;transition:border-color .3s;margin-bottom:1rem}
.invite-input-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.invite-input-wrap input::placeholder{letter-spacing:1px;text-transform:none;color:var(--muted)}
.invite-btn{width:100%;padding:14px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;border-radius:var(--r);transition:all .2s}
.invite-btn:hover{background:#2563eb;transform:translateY(-1px)}
.invite-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.invite-error{color:var(--red);font-size:.85rem;margin-top:.75rem;min-height:1.2em}
.invite-info{color:var(--muted);font-size:.75rem;margin-top:1.5rem;line-height:1.6}

/* ===== MAIN APP ===== */
#app{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.topbar-logo{font-family:var(--mono);font-weight:700;font-size:1.1rem;color:var(--accent);white-space:nowrap}
.topbar-logo span{color:var(--text)}
.topbar-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar-plan{font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:600}
.topbar-uses{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.topbar-logout{padding:5px 12px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--r);font-size:.75rem;transition:all .2s}
.topbar-logout:hover{border-color:var(--red);color:var(--red)}
.plan-free{background:rgba(100,116,139,.2);color:var(--text2)}
.plan-standard{background:rgba(59,130,246,.15);color:var(--accent)}
.plan-pro{background:rgba(139,92,246,.15);color:var(--purple)}

/* Controls */
.controls{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono)}
.ctrl-select{padding:7px 12px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.85rem;min-width:80px}
.ctrl-select:focus{border-color:var(--accent)}
.ctrl-input{padding:7px 12px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:.85rem;width:140px;text-transform:uppercase}
.ctrl-input:focus{border-color:var(--accent)}
.ctrl-date{padding:7px 10px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:.8rem;width:130px}
.ctrl-date:focus{border-color:var(--accent)}
.ctrl-btn{padding:7px 16px;border-radius:var(--r);font-size:.85rem;font-weight:500;transition:all .2s}
.btn-load{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-load:hover{border-color:var(--accent);color:var(--accent)}
.btn-analyze{background:var(--accent);color:#fff;font-weight:600}
.btn-analyze:hover{background:#2563eb}
.btn-analyze:disabled{opacity:.4;cursor:not-allowed}
.status-msg{font-size:.8rem;color:var(--muted);font-family:var(--mono);margin-left:4px}
.status-msg.error{color:var(--red)}

/* Mode toggle */
.mode-bar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border)}
.mode-toggle{display:flex;background:var(--input);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.mode-toggle button{padding:6px 16px;font-size:.8rem;font-weight:500;background:transparent;color:var(--muted);transition:all .2s}
.mode-toggle button.active{background:var(--accent);color:#fff}
.mode-toggle button:not(.active):hover{color:var(--text)}
.mode-desc{font-size:.75rem;color:var(--muted)}
.mode-locked{font-size:.7rem;color:var(--yellow);font-family:var(--mono)}

/* Chart */
.chart-wrapper{position:relative;width:100%;background:var(--bg)}
#chartContainer{width:100%;height:55vh;min-height:350px}
.loading-overlay{position:absolute;inset:0;background:rgba(10,14,23,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px;backdrop-filter:blur(4px)}
.loading-overlay.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{font-size:.9rem;color:var(--text2);font-family:var(--mono)}

/* Date bar */
.date-bar{padding:10px 20px;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:none}
.date-bar-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date-bar .ctrl-label{min-width:40px}
.date-info{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-left:auto}

/* Result panel */
.result-panel{padding:16px 20px;background:var(--bg2);border-top:1px solid var(--border)}
.result-hidden{display:none}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.result-card-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);margin-bottom:4px}
.result-card-value{font-size:1.1rem;font-weight:700;font-family:var(--mono)}
.result-card-detail{font-size:.8rem;color:var(--text2);margin-top:4px}
.direction-long{color:var(--green)}.direction-short{color:var(--red)}.direction-hold{color:var(--yellow)}
.result-comment{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;font-size:.9rem;color:var(--text2);line-height:1.6;margin-bottom:12px}
.result-comment strong{color:var(--text)}

/* Strategic stages */
.stages-wrap{margin-bottom:12px}
.stage-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;position:relative}
.stage-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r) 0 0 var(--r)}
.stage-card.stage-1::before{background:var(--accent)}
.stage-card.stage-2::before{background:var(--purple)}
.stage-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stage-num{font-family:var(--mono);font-weight:700;font-size:.85rem}
.stage-1 .stage-num{color:var(--accent)}
.stage-2 .stage-num{color:var(--purple)}
.stage-trigger{font-size:.8rem;color:var(--yellow);font-family:var(--mono)}
.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stage-item{text-align:center}
.stage-item-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
.stage-item-val{font-size:.95rem;font-weight:600;font-family:var(--mono);margin-top:2px}
.stage-reason{font-size:.8rem;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* Exit strategy */
.exit-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}
.exit-title{font-size:.7rem;color:var(--cyan);text-transform:uppercase;font-family:var(--mono);letter-spacing:1px;margin-bottom:8px}
.exit-row{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.exit-row strong{color:var(--text);font-weight:500}

/* Indicators */
.indicator-section-title{font-size:.7rem;color:var(--muted);text-transform:uppercase;font-family:var(--mono);letter-spacing:1px;margin-bottom:8px;margin-top:4px}
.indicator-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.ind-card{background:var(--input);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;position:relative}
.ind-card.primary::after{content:'PRIMARY';position:absolute;top:4px;right:6px;font-size:.5rem;color:var(--accent);font-family:var(--mono);letter-spacing:1px;opacity:.7}
.ind-card.supplementary::after{content:'SUB';position:absolute;top:4px;right:6px;font-size:.5rem;color:var(--muted);font-family:var(--mono);letter-spacing:1px;opacity:.5}
.ind-name{font-size:.7rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ind-signal{font-size:.85rem;font-weight:600;margin:4px 0 2px}
.ind-signal.bull{color:var(--green)}.ind-signal.bear{color:var(--red)}.ind-signal.neutral{color:var(--yellow)}
.ind-detail{font-size:.75rem;color:var(--text2)}

/* Disclaimer */
.disclaimer{padding:12px 20px;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);background:var(--bg2);line-height:1.5}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:640px){
  .topbar{padding:8px 12px}.controls{padding:8px 12px}.date-bar{padding:8px 12px}
  .result-panel{padding:12px}#chartContainer{height:45vh;min-height:280px}
  .result-grid{grid-template-columns:1fr 1fr}
  .stage-grid{grid-template-columns:repeat(2,1fr)}
  .ctrl-input{width:100px}.ctrl-date{width:110px}
}
</style>
</head>
<body>

<!-- INVITE SCREEN -->
<div id="inviteScreen">
  <div class="invite-container">
    <div class="invite-logo">Trade<span>Scope</span></div>
    <div class="invite-sub">AI 기반 차트 분석 플랫폼</div>
    <div class="invite-input-wrap">
      <input type="text" id="inviteInput" placeholder="초대 코드 입력" maxlength="30" autocomplete="off" spellcheck="false">
    </div>
    <button class="invite-btn" id="inviteBtn" onclick="verifyInvite()">접속하기</button>
    <div class="invite-error" id="inviteError"></div>
    <div class="invite-info">초대 코드가 필요합니다.<br>관리자에게 문의하세요.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Trade<span>Scope</span> <span style="font-size:.7rem;color:var(--muted);font-weight:400">AI</span></div>
    <div class="topbar-controls">
      <span class="topbar-plan" id="planBadge"></span>
      <span class="topbar-uses" id="usesDisplay"></span>
      <button class="topbar-logout" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <!-- Controls row 1: market/symbol/timeframe -->
  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">마켓</span>
      <select class="ctrl-select" id="marketSelect">
        <option value="us_stock">미국주식</option>
        <option value="kr_stock">한국주식</option>
        <option value="crypto">코인</option>
        <option value="forex">FOREX</option>
        <option value="futures">선물/지수</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">심볼</span>
      <input type="text" class="ctrl-input" id="symbolInput" placeholder="AAPL" spellcheck="false">
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">타임프레임</span>
      <select class="ctrl-select" id="tfSelect">
        <option value="1m">1분</option>
        <option value="5m">5분</option>
        <option value="15m">15분</option>
        <option value="1h">1시간</option>
        <option value="4h">4시간</option>
        <option value="1d" selected>일봉</option>
        <option value="1wk">주봉</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">시작</span>
      <input type="date" class="ctrl-date" id="dateStart">
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">종료</span>
      <input type="date" class="ctrl-date" id="dateEnd">
    </div>
    <button class="ctrl-btn btn-load" onclick="loadData()">데이터 로드</button>
    <button class="ctrl-btn btn-analyze" id="analyzeBtn" onclick="runAnalysis()" disabled>AI 분석</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <!-- Mode toggle bar -->
  <div class="mode-bar" id="modeBar" style="display:none">
    <div class="mode-toggle" id="modeToggle">
      <button class="active" data-mode="simple" onclick="setMode('simple')">간단 매매</button>
      <button data-mode="strategic" onclick="setMode('strategic')">전략 매매</button>
    </div>
    <span class="mode-desc" id="modeDesc">단일 진입/청산</span>
    <span class="mode-locked" id="modeLocked" style="display:none"></span>
  </div>

  <!-- Chart -->
  <div class="chart-wrapper">
    <div id="chartContainer"></div>
    <div class="loading-overlay hidden" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">데이터 불러오는 중...</div>
    </div>
  </div>

  <!-- Date info bar -->
  <div class="date-bar" id="dateBar">
    <div class="date-bar-inner">
      <span class="date-info" id="dateInfo"></span>
    </div>
  </div>

  <!-- Results -->
  <div class="result-panel result-hidden" id="resultPanel">
    <!-- Simple mode results -->
    <div id="simpleResults">
      <div class="result-grid">
        <div class="result-card"><div class="result-card-label">방향</div><div class="result-card-value" id="resDirection">—</div><div class="result-card-detail" id="resConfidence"></div></div>
        <div class="result-card"><div class="result-card-label">진입가</div><div class="result-card-value" id="resEntry" style="color:var(--green)">—</div></div>
        <div class="result-card"><div class="result-card-label">익절가</div><div class="result-card-value" id="resTP" style="color:var(--blue)">—</div></div>
        <div class="result-card"><div class="result-card-label">손절가</div><div class="result-card-value" id="resSL" style="color:var(--red)">—</div></div>
        <div class="result-card"><div class="result-card-label">리스크:리워드</div><div class="result-card-value" id="resRR" style="color:var(--cyan)">—</div></div>
      </div>
    </div>

    <!-- Strategic mode results -->
    <div id="strategicResults" style="display:none">
      <div class="result-grid" style="margin-bottom:12px">
        <div class="result-card"><div class="result-card-label">방향</div><div class="result-card-value" id="resDirection2">—</div><div class="result-card-detail" id="resConfidence2"></div></div>
      </div>
      <div class="stages-wrap" id="stagesWrap"></div>
      <div class="exit-card" id="exitCard" style="display:none">
        <div class="exit-title">청산 전략</div>
        <div id="exitContent"></div>
      </div>
    </div>

    <div class="result-comment" id="resComment"></div>

    <!-- Indicators (shared) -->
    <div class="indicator-section-title">주요 지표 (TSI · RSI = PRIMARY)</div>
    <div class="indicator-row" id="indicatorRow"></div>
  </div>

  <div class="disclaimer">
    본 분석은 AI 자동 해석이며 투자 조언이 아닙니다. 실거래 전 반드시 본인의 판단으로 검증하세요.
  </div>
</div>

<script>
// ===== STATE =====
let allCandles = [];
let chart = null, candleSeries = null, volumeSeries = null;
let currentCode = '', currentPlan = '';
let currentMode = 'simple';
let priceLines = [];
const API_BASE = '/.netlify/functions';

// ===== DEFAULTS =====
function setDefaultDates() {
  const now = new Date();
  const end = now.toISOString().split('T')[0];
  const start = new Date(now);
  start.setMonth(start.getMonth() - 6);
  document.getElementById('dateEnd').value = end;
  document.getElementById('dateStart').value = start.toISOString().split('T')[0];
}
setDefaultDates();

// ===== STATUS =====
function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg' + (isError ? ' error' : '');
}

// ===== INVITE =====
document.getElementById('inviteInput').addEventListener('keydown', e => { if (e.key === 'Enter') verifyInvite(); });

async function verifyInvite() {
  const code = document.getElementById('inviteInput').value.trim();
  if (!code) { document.getElementById('inviteError').textContent = '코드를 입력해주세요.'; return; }
  const btn = document.getElementById('inviteBtn');
  btn.disabled = true; btn.textContent = '확인 중...';
  document.getElementById('inviteError').textContent = '';
  try {
    const res = await fetch(API_BASE + '/invite', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'verify', code })
    });
    const data = await res.json();
    if (data.valid) {
      currentCode = code.toUpperCase();
      currentPlan = data.plan;
      sessionStorage.setItem('inviteCode', currentCode);
      sessionStorage.setItem('plan', currentPlan);
      showApp(data);
    } else {
      document.getElementById('inviteError').textContent = data.error || '유효하지 않은 코드';
    }
  } catch { document.getElementById('inviteError').textContent = '서버 연결 실패'; }
  btn.disabled = false; btn.textContent = '접속하기';
}

function showApp(data) {
  document.getElementById('inviteScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const badge = document.getElementById('planBadge');
  const names = { free: '무료체험', standard: '스탠다드', pro: '프로' };
  badge.textContent = names[currentPlan] || currentPlan;
  badge.className = 'topbar-plan plan-' + currentPlan;
  updateUsesDisplay(data);
  setupModeBar();
  initChart();
}

function updateUsesDisplay(data) {
  const el = document.getElementById('usesDisplay');
  if (data && data.remaining !== undefined) {
    el.textContent = typeof data.remaining === 'number'
      ? `오늘 ${data.usedToday || 0}/${data.maxDaily}회`
      : '무제한';
  }
}

function logout() {
  sessionStorage.clear();
  currentCode = ''; currentPlan = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('inviteScreen').style.display = 'flex';
  document.getElementById('inviteInput').value = '';
}

// Auto-login
(function() {
  const saved = sessionStorage.getItem('inviteCode');
  if (saved) {
    currentCode = saved;
    currentPlan = sessionStorage.getItem('plan') || 'free';
    fetch(API_BASE + '/invite', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'verify', code: currentCode })
    }).then(r => r.json()).then(data => { if (data.valid) showApp(data); }).catch(() => {});
  }
})();

// ===== MODE =====
function setupModeBar() {
  const bar = document.getElementById('modeBar');
  bar.style.display = 'flex';
  const locked = document.getElementById('modeLocked');
  const btns = document.querySelectorAll('#modeToggle button');

  if (currentPlan === 'free') {
    // Free: simple only
    currentMode = 'simple';
    btns[1].disabled = true;
    btns[1].style.opacity = '.3';
    locked.textContent = '전략 매매는 스탠다드 이상 플랜에서 사용 가능';
    locked.style.display = 'inline';
  } else {
    // Standard & Pro: both modes
    btns[1].disabled = false;
    btns[1].style.opacity = '1';
    locked.style.display = 'none';
  }
  setMode(currentMode);
}

function setMode(mode) {
  if (mode === 'strategic' && currentPlan === 'free') return;
  currentMode = mode;
  document.querySelectorAll('#modeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const desc = document.getElementById('modeDesc');
  desc.textContent = mode === 'simple' ? '단일 진입/청산' : '1차·2차 분할 매매';
  // Hide results on mode switch
  document.getElementById('resultPanel').classList.add('result-hidden');
}

// ===== CHART =====
function initChart() {
  const container = document.getElementById('chartContainer');
  if (chart) { chart.remove(); chart = null; }
  chart = LightweightCharts.createChart(container, {
    width: container.clientWidth, height: container.clientHeight,
    layout: { background: { type: 'solid', color: '#0a0e17' }, textColor: '#94a3b8', fontSize: 11, fontFamily: 'JetBrains Mono' },
    grid: { vertLines: { color: '#1e2a4222' }, horzLines: { color: '#1e2a4222' } },
    crosshair: { mode: 0, vertLine: { color: '#3b82f644', width: 1 }, horzLine: { color: '#3b82f644', width: 1 } },
    rightPriceScale: { borderColor: '#1e2a42', scaleMargins: { top: 0.05, bottom: 0.25 } },
    timeScale: { borderColor: '#1e2a42', timeVisible: true, secondsVisible: false }
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e88', wickDownColor: '#ef444488'
  });
  volumeSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', color: '#3b82f633' });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  new ResizeObserver(() => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  }).observe(container);
}

// ===== LOAD DATA (date-based) =====
async function loadData() {
  const symbol = document.getElementById('symbolInput').value.trim();
  const market = document.getElementById('marketSelect').value;
  const tf = document.getElementById('tfSelect').value;
  const startDate = document.getElementById('dateStart').value;
  const endDate = document.getElementById('dateEnd').value;
  if (!symbol) { setStatus('심볼을 입력하세요', true); return; }

  showLoading('데이터 불러오는 중...');
  setStatus('로딩 중...');
  try {
    const payload = { symbol, market, timeframe: tf };
    if (startDate) payload.startDate = startDate;
    if (endDate) payload.endDate = endDate;

    const res = await fetch(API_BASE + '/yahoo', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.error) { setStatus(data.error, true); hideLoading(); return; }
    if (!data.candles || data.candles.length === 0) { setStatus('데이터 없음', true); hideLoading(); return; }

    allCandles = data.candles;
    setStatus(`${data.symbol} — ${allCandles.length}개 캔들 로드`, false);
    updateChart();
    updateDateInfo();
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('resultPanel').classList.add('result-hidden');
    clearPriceLines();
  } catch { setStatus('네트워크 오류', true); }
  hideLoading();
}

function updateChart() {
  if (!candleSeries || allCandles.length === 0) return;
  const isIntraday = ['1m','5m','15m','1h','4h'].includes(document.getElementById('tfSelect').value);
  const candleData = allCandles.map(c => ({
    time: isIntraday ? c.time : Math.floor(c.time / 86400) * 86400,
    open: c.open, high: c.high, low: c.low, close: c.close
  }));
  const volData = allCandles.map(c => ({
    time: isIntraday ? c.time : Math.floor(c.time / 86400) * 86400,
    value: c.volume, color: c.close >= c.open ? '#22c55e33' : '#ef444433'
  }));
  candleSeries.setData(candleData);
  volumeSeries.setData(volData);
  chart.timeScale().fitContent();
  clearPriceLines();
}

function updateDateInfo() {
  const bar = document.getElementById('dateBar');
  bar.style.display = 'block';
  if (allCandles.length === 0) { document.getElementById('dateInfo').textContent = ''; return; }
  const first = new Date(allCandles[0].time * 1000).toLocaleDateString('ko-KR');
  const last = new Date(allCandles[allCandles.length - 1].time * 1000).toLocaleDateString('ko-KR');
  document.getElementById('dateInfo').textContent = `${first} ~ ${last} · ${allCandles.length}개 캔들`;
}

// ===== PRICE LINES =====
function clearPriceLines() {
  priceLines.forEach(l => { try { candleSeries.removePriceLine(l); } catch {} });
  priceLines = [];
  try { candleSeries.setMarkers([]); } catch {}
}
function addPriceLine(price, color, title) {
  const line = candleSeries.createPriceLine({ price, color, lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title });
  priceLines.push(line);
}

// ===== AI ANALYSIS =====
async function runAnalysis() {
  if (allCandles.length === 0) return;
  // Verify usage
  try {
    const vr = await fetch(API_BASE + '/invite', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'verify', code: currentCode }) });
    const vd = await vr.json();
    if (!vd.valid) { setStatus(vd.error, true); return; }
  } catch {}

  if (allCandles.length < 30) { setStatus('최소 30개 캔들이 필요합니다', true); return; }

  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  const tf = document.getElementById('tfSelect').value;

  showLoading('AI가 분석 중입니다...');
  setStatus('분석 요청 중...', false);
  document.getElementById('analyzeBtn').disabled = true;

  try {
    const res = await fetch(API_BASE + '/analyze', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ candles: allCandles, symbol, timeframe: tf, mode: currentMode })
    });
    const data = await res.json();
    if (data.error) { setStatus(data.error, true); hideLoading(); document.getElementById('analyzeBtn').disabled = false; return; }

    // Increment usage
    try {
      const ur = await fetch(API_BASE + '/invite', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ action: 'use', code: currentCode }) });
      const ud = await ur.json();
      updateUsesDisplay(ud);
    } catch {}

    displayResults(data);
    setStatus('분석 완료', false);
  } catch (err) { setStatus('분석 실패: ' + err.message, true); }
  hideLoading();
  document.getElementById('analyzeBtn').disabled = false;
}

// ===== DISPLAY RESULTS =====
const fmt = v => v != null ? Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:6}) : '—';

function displayResults(data) {
  const panel = document.getElementById('resultPanel');
  panel.classList.remove('result-hidden');
  clearPriceLines();

  const isStrategic = data.mode === 'strategic' && data.stages;

  // Toggle simple/strategic sections
  document.getElementById('simpleResults').style.display = isStrategic ? 'none' : 'block';
  document.getElementById('strategicResults').style.display = isStrategic ? 'block' : 'none';

  if (isStrategic) {
    displayStrategicResults(data);
  } else {
    displaySimpleResults(data);
  }

  // Comment
  document.getElementById('resComment').innerHTML = `<strong>AI 코멘트:</strong> ${data.comment || '—'}`;

  // Indicators (TSI/RSI first as primary)
  displayIndicators(data.indicators);

  // ICT overlay
  drawICTOverlay(data.ictOverlay);

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function displaySimpleResults(data) {
  const dirMap = { LONG: '매수 (LONG)', SHORT: '매도 (SHORT)', HOLD: '관망 (HOLD)' };
  const dirClass = { LONG: 'direction-long', SHORT: 'direction-short', HOLD: 'direction-hold' };

  const dirEl = document.getElementById('resDirection');
  dirEl.textContent = dirMap[data.direction] || data.direction;
  dirEl.className = 'result-card-value ' + (dirClass[data.direction] || '');
  document.getElementById('resConfidence').textContent = `신뢰도: ${data.confidence || '—'}`;
  document.getElementById('resEntry').textContent = fmt(data.entry);
  document.getElementById('resTP').textContent = fmt(data.takeProfit);
  document.getElementById('resSL').textContent = fmt(data.stopLoss);
  document.getElementById('resRR').textContent = data.riskReward || '—';

  if (data.entry) addPriceLine(data.entry, '#22c55e', '진입 ' + fmt(data.entry));
  if (data.takeProfit) addPriceLine(data.takeProfit, '#3b82f6', '익절 ' + fmt(data.takeProfit));
  if (data.stopLoss) addPriceLine(data.stopLoss, '#ef4444', '손절 ' + fmt(data.stopLoss));
}

function displayStrategicResults(data) {
  const dirMap = { LONG: '매수 (LONG)', SHORT: '매도 (SHORT)', HOLD: '관망 (HOLD)' };
  const dirClass = { LONG: 'direction-long', SHORT: 'direction-short', HOLD: 'direction-hold' };

  const dirEl = document.getElementById('resDirection2');
  dirEl.textContent = dirMap[data.direction] || data.direction;
  dirEl.className = 'result-card-value ' + (dirClass[data.direction] || '');
  document.getElementById('resConfidence2').textContent = `신뢰도: ${data.confidence || '—'}`;

  // Stages
  const wrap = document.getElementById('stagesWrap');
  wrap.innerHTML = '';
  const stageColors = ['#3b82f6', '#8b5cf6'];
  (data.stages || []).forEach((s, i) => {
    const card = document.createElement('div');
    card.className = `stage-card stage-${i + 1}`;
    card.innerHTML = `
      <div class="stage-header">
        <span class="stage-num">${s.label || (i + 1) + '차 진입'}</span>
        <span class="stage-trigger">${s.trigger || ''}</span>
      </div>
      <div class="stage-grid">
        <div class="stage-item"><div class="stage-item-label">진입가</div><div class="stage-item-val" style="color:var(--green)">${fmt(s.entry)}</div></div>
        <div class="stage-item"><div class="stage-item-label">손절가</div><div class="stage-item-val" style="color:var(--red)">${fmt(s.stopLoss)}</div></div>
        <div class="stage-item"><div class="stage-item-label">익절가</div><div class="stage-item-val" style="color:var(--blue)">${fmt(s.takeProfit)}</div></div>
        <div class="stage-item"><div class="stage-item-label">비중</div><div class="stage-item-val" style="color:var(--cyan)">${s.positionSize || '50%'}</div></div>
      </div>
      ${s.reason ? `<div class="stage-reason">${s.reason}</div>` : ''}
    `;
    wrap.appendChild(card);

    // Price lines per stage
    const clr = stageColors[i] || '#3b82f6';
    if (s.entry) addPriceLine(s.entry, '#22c55e', `${i+1}차 진입`);
    if (s.stopLoss) addPriceLine(s.stopLoss, '#ef4444', `${i+1}차 손절`);
    if (s.takeProfit) addPriceLine(s.takeProfit, clr, `${i+1}차 익절`);
  });

  // Exit strategy
  if (data.exitStrategy) {
    const ec = document.getElementById('exitCard');
    ec.style.display = 'block';
    const ex = data.exitStrategy;
    document.getElementById('exitContent').innerHTML = `
      ${ex.partialExit ? `<div class="exit-row"><strong>부분 청산:</strong> ${ex.partialExit}</div>` : ''}
      ${ex.fullExit ? `<div class="exit-row"><strong>전량 청산:</strong> ${ex.fullExit}</div>` : ''}
      ${ex.trailingStop ? `<div class="exit-row"><strong>트레일링 스탑:</strong> ${ex.trailingStop}</div>` : ''}
    `;
  } else {
    document.getElementById('exitCard').style.display = 'none';
  }
}

function displayIndicators(indicators) {
  const row = document.getElementById('indicatorRow');
  row.innerHTML = '';
  if (!indicators) return;

  // Order: TSI, RSI (primary) → Volume, ICT (supplementary)
  const indList = [
    { key: 'tsi', name: 'TSI (13,8,8)', primary: true },
    { key: 'rsi', name: 'RSI (21)', primary: true },
    { key: 'volume', name: '거래량', primary: false },
    { key: 'ict', name: 'ICT', primary: false }
  ];
  indList.forEach(ind => {
    const d = indicators[ind.key];
    if (!d) return;
    const sigClass = d.signal === 'BULLISH' ? 'bull' : d.signal === 'BEARISH' ? 'bear' : 'neutral';
    const sigText = d.signal === 'BULLISH' ? '매수 강세' : d.signal === 'BEARISH' ? '매도 강세' : '중립';
    let extra = '';
    if (d.value !== undefined) extra = ` (${Number(d.value).toFixed(2)})`;
    row.innerHTML += `
      <div class="ind-card ${ind.primary ? 'primary' : 'supplementary'}">
        <div class="ind-name">${ind.name}</div>
        <div class="ind-signal ${sigClass}">${sigText}${extra}</div>
        <div class="ind-detail">${d.detail || ''}</div>
      </div>`;
  });
}

function drawICTOverlay(overlay) {
  if (!overlay) return;
  if (overlay.bos && overlay.bos.length > 0) {
    const isIntraday = ['1m','5m','15m','1h','4h'].includes(document.getElementById('tfSelect').value);
    const markers = overlay.bos.map(b => {
      const candle = allCandles[b.index];
      if (!candle) return null;
      return {
        time: isIntraday ? candle.time : Math.floor(candle.time / 86400) * 86400,
        position: b.type === 'bullish' ? 'belowBar' : 'aboveBar',
        color: b.type === 'bullish' ? '#22c55e' : '#ef4444',
        shape: b.type === 'bullish' ? 'arrowUp' : 'arrowDown',
        text: b.type === 'bullish' ? 'BOS↑' : 'BOS↓'
      };
    }).filter(Boolean);
    if (markers.length > 0) try { candleSeries.setMarkers(markers); } catch {}
  }
  if (overlay.orderBlocks) {
    overlay.orderBlocks.slice(0, 3).forEach(ob => {
      const c = ob.type === 'bullish' ? '#22c55e44' : '#ef444444';
      addPriceLine(ob.high, c, 'OB'); addPriceLine(ob.low, c, 'OB');
    });
  }
  if (overlay.liquidityZones) {
    overlay.liquidityZones.slice(0, 2).forEach(lz => {
      addPriceLine(lz.price, '#eab30866', lz.type === 'buy_side' ? 'BSL' : 'SSL');
    });
  }
}

// ===== HELPERS =====
function showLoading(text) { document.getElementById('loadingText').textContent = text || '로딩 중...'; document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

// Market presets
document.getElementById('marketSelect').addEventListener('change', function() {
  const ph = { us_stock: 'AAPL', kr_stock: '005930', crypto: 'BTC', forex: 'EURUSD', futures: 'ES=F' };
  document.getElementById('symbolInput').placeholder = ph[this.value] || 'AAPL';
});
document.getElementById('symbolInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadData(); });
</script>
